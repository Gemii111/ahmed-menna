<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    @font-face {
      font-family: 'DetailTextFont';
      src: url('_assets/fonts/8fbba774c32932015ba2a54d5bcbd180.woff') format('woff');
    }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: transparent !important; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-family: 'DetailTextFont', -apple-system, sans-serif;
      color: #5d2c24;
    }
    .countdown-grid {
      display: flex; align-items: center; justify-content: center;
      gap: 12px; width: 100%;
    }
    .unit-box {
      display: flex; flex-direction: column; align-items: center;
      min-width: 65px;
    }
    .num {
      font-size: 42px; font-weight: 700; line-height: 1;
    }
    .lbl {
      font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
      opacity: 0.8; margin-top: 6px;
    }
    .sep {
      font-size: 32px; font-weight: 700; margin-bottom: 18px; opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="countdown-grid">
    <div class="unit-box">
      <span class="num" id="d">00</span>
      <span class="lbl">DAYS</span>
    </div>
    <span class="sep">:</span>
    <div class="unit-box">
      <span class="num" id="h">00</span>
      <span class="lbl">HOURS</span>
    </div>
    <span class="sep">:</span>
    <div class="unit-box">
      <span class="num" id="m">00</span>
      <span class="lbl">MINUTES</span>
    </div>
    <span class="sep">:</span>
    <div class="unit-box">
      <span class="num" id="s">00</span>
      <span class="lbl">SECONDS</span>
    </div>
  </div>

  <script>
    var target = new Date('2026-10-18T19:00:00+03:00').getTime();
    function tick() {
      var diff = Math.max(0, target - Date.now());
      var d = Math.floor(diff / (1000 * 60 * 60 * 24));
      var h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      var m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      var s = Math.floor((diff % (1000 * 60)) / 1000);
      document.getElementById('d').textContent = d < 10 ? '0' + d : d;
      document.getElementById('h').textContent = h < 10 ? '0' + h : h;
      document.getElementById('m').textContent = m < 10 ? '0' + m : m;
      document.getElementById('s').textContent = s < 10 ? '0' + s : s;
    }
    tick(); setInterval(tick, 1000);
  </script>
</body>
</html>
