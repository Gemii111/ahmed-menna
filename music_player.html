<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: transparent !important; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .music-player {
      width: 100px; height: 100px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; user-select: none;
    }
    .music-player__icon { width: 90px; height: 90px; }
    .music-player__icon--bounce { animation: bounce 2s ease-in-out infinite; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
  </style>
</head>
<body>
  <div id="music-player" class="music-player" role="button" tabindex="0" aria-label="Play music">
    <audio id="audio-player" src="_assets/music/a_thousand_years.mp3" preload="auto" loop style="display:none;"></audio>
    <svg data-icon="note" class="music-player__icon music-player__icon--bounce" viewBox="0 0 58.08 58.55">
      <path d="M57.17.64c-.58-.5-1.34-.73-2.1-.62L18.15,5.3c-1.3.19-2.26,1.3-2.26,2.61v30.91c-1.56-.91-3.37-1.43-5.31-1.43-5.83,0-10.58,4.75-10.58,10.58s4.75,10.58,10.58,10.58,10.58-4.75,10.58-10.58v-27.23l31.64-4.52v17.33c-1.56-.91-3.37-1.43-5.31-1.43-5.83,0-10.58,4.75-10.58,10.58s4.75,10.58,10.58,10.58,10.58-4.75,10.58-10.58V2.64c0-.76-.33-1.49-.91-1.99Z" fill="#fff"/>
    </svg>
    <svg data-icon="pause" class="music-player__icon" style="display:none;" viewBox="0 0 100 100">
      <rect x="28" y="20" width="16" height="60" rx="4" fill="#fff"/>
      <rect x="56" y="20" width="16" height="60" rx="4" fill="#fff"/>
    </svg>
    <svg data-icon="play" class="music-player__icon" style="display:none;" viewBox="0 0 100 100">
      <polygon points="30,20 30,80 75,50" fill="#fff"/>
    </svg>
  </div>

  <script>
    (function() {
      var player = document.getElementById('music-player');
      var audio = document.getElementById('audio-player');
      var noteIcon = player.querySelector('[data-icon="note"]');
      var pauseIcon = player.querySelector('[data-icon="pause"]');
      var playIcon = player.querySelector('[data-icon="play"]');
      var state = 'paused';

      function updateUI() {
        noteIcon.style.display = (state === 'note' || state === 'paused') ? 'block' : 'none';
        pauseIcon.style.display = (state === 'playing') ? 'block' : 'none';
        playIcon.style.display = (state === 'paused_manual') ? 'block' : 'none';
      }

      function toggle() {
        if (state === 'playing') {
          audio.pause();
          state = 'paused_manual';
        } else {
          audio.play().then(function() {
            state = 'playing';
            updateUI();
          }).catch(function(e) { console.log(e); });
        }
        updateUI();
      }

      player.addEventListener('click', toggle);

      // Listen to parent message if any
      window.addEventListener('message', function(e) {
        if (e.data === 'play') {
          audio.play(); state = 'playing'; updateUI();
        } else if (e.data === 'pause') {
          audio.pause(); state = 'paused_manual'; updateUI();
        }
      });
    })();
  </script>
</body>
</html>
